<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unrailed 2 — Wagon Setup Builder</title>
<style>
  :root{
    --bg: #10161d;
    --panel: #1a232c;
    --panel-2: #202b35;
    --line: #2c3946;
    --tie: #4a3728;
    --text: #e7ecf2;
    --muted: #8a97a6;
    --amber: #ffb627;
    --amber-dim: #8a6c2c;
    --green: #4bd18a;
    --danger: #e2584f;
    --radius: 6px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -200px, #1c2733 0%, var(--bg) 60%);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 32px 24px 80px;
  }
  h1,h2,h3{
    font-family: 'Bahnschrift', 'Segoe UI Semibold', system-ui, sans-serif;
    font-weight: 600;
    margin: 0;
  }
  .wrap{ max-width: 1200px; margin: 0 auto; }
  header{ text-align:center; margin-bottom: 18px; }
  header h1{ font-size: 28px; letter-spacing: 0.5px; color: var(--text); }

  .track{
    height: 14px;
    margin: 22px 0;
    background:
      repeating-linear-gradient(90deg, var(--tie) 0px, var(--tie) 10px, transparent 10px, transparent 26px);
    position: relative;
    opacity: 0.8;
  }
  .track::before, .track::after{
    content:"";
    position:absolute; left:0; right:0; height:2px; background: var(--amber-dim);
  }
  .track::before{ top:4px; }
  .track::after{ bottom:4px; }

  section > h2, .section-title{
    font-size: 16px;
    color: var(--amber);
    margin-bottom: 14px;
  }

  details.panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 4px 18px 18px;
    margin-bottom: 20px;
  }
  details.panel summary{
    cursor:pointer;
    padding: 14px 0;
    font-family: 'Bahnschrift', 'Segoe UI Semibold', sans-serif;
    font-size: 17px;
    color: var(--amber);
    list-style: none;
    display:flex; align-items:center; gap:8px;
  }
  details.panel summary::-webkit-details-marker{ display:none; }
  details.panel summary::before{ content: "▸"; transition: transform .15s; }
  details.panel[open] summary::before{ transform: rotate(90deg); }

  .lib-toolbar{
    display:flex; gap:8px; margin: 0 0 14px;
    flex-wrap: wrap; align-items:center;
  }

  .lib-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 900px){ .lib-grid{ grid-template-columns: 1fr; } }

  .lib-col h3{ font-size: 14px; color: var(--text); margin-bottom: 8px; }

  .lib-row{
    display:grid;
    grid-template-columns: 1fr 1.6fr auto;
    gap: 6px;
    margin-bottom: 6px;
  }
  .lib-row input{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12.5px;
    width: 100%;
  }
  .lib-row input.path{ font-family: 'Consolas', 'SFMono-Regular', monospace; }
  .lib-row input:focus{ outline: none; border-color: var(--amber-dim); }

  button{
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    padding: 6px 10px;
    font-size: 12.5px;
  }
  button:hover{ border-color: var(--amber-dim); }
  button.icon-btn{ padding: 4px 8px; color: var(--danger); }
  button.add-btn{
    margin-top: 4px;
    color: var(--amber);
    border-color: var(--amber-dim);
    width:100%;
  }
  button.primary{
    background: var(--amber);
    color: #241a06;
    border-color: var(--amber);
    font-weight:600;
  }
  button.primary:hover{ filter: brightness(1.08); }
  button.danger-btn{
    color: var(--danger);
    border-color: var(--danger);
  }
  button.danger-btn:hover{
    background: rgba(226, 88, 79, 0.15);
  }

  .builder-toolbar{
    display:flex; align-items:center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .builder-toolbar .count{ color: var(--muted); font-size: 13px; }

  .engine-card, .wagon-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    position: relative;
  }
  .engine-row{ display:flex; align-items:center; gap:16px; margin-bottom: 20px; }
  .engine-card{ display:flex; align-items:center; gap:14px; flex:1; padding-right: 60px; }
  
  .slot-preview{
    width: 74px; height: 74px;
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 4px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
    transition: border-color 0.15s, background 0.15s;
  }
  .slot-preview.clickable{ cursor: pointer; }
  .slot-preview.clickable:hover{ border-color: var(--amber); background: #24303c; }
  .slot-preview img{ max-width:100%; max-height:100%; object-fit:contain; }
  .slot-preview.placeholder{ color: var(--muted); font-size: 10px; text-align:center; padding:2px; }
  .engine-card .slot-preview{ width: 104px; height: 104px; }
  .wagon-top .slot-preview{ width: 86px; height: 86px; }

  .card-badge{
    position:absolute; top:8px; right:8px;
    background: var(--panel-2);
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    font-size: 11px;
    font-family: 'Consolas', 'SFMono-Regular', monospace;
    padding: 2px 7px;
    border-radius: 10px;
    z-index: 1;
  }
  .card-badge-inline{
    background: var(--panel-2);
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    font-size: 11px;
    font-family: 'Consolas', 'SFMono-Regular', monospace;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .meta-label{
    display:block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px;
  }
  .meta-field{ display: flex; flex-direction: column; }
  .level-input{
    width: 80px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12.5px;
  }
  .level-input:focus{ outline:none; border-color: var(--amber-dim); }

  .select-btn{
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 6px 10px;
    font-size: 12.5px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .select-btn:hover{ border-color: var(--amber-dim); }

  /* Horizontal scroll & drag container */
  .wagons-scroll{
    width: 100%;
    overflow-x: auto;
    padding: 10px 0;
  }
  .wagons-row{
    display:flex; 
    gap: 16px; 
    width: max-content;
    margin: 0 auto;
    padding: 0 24px;
  }
  
  .wagon-card{
    min-width: 250px;
    max-width: 270px;
    display:flex; flex-direction:column; gap:10px;
    padding: 12px;
    cursor: grab;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .wagon-card:active{ cursor: grabbing; }
  .wagon-card.dragging{ opacity: 0.4; }
  .wagon-card.drag-over{
    border-color: var(--amber);
    box-shadow: 0 0 12px rgba(255, 182, 39, 0.35);
  }

  .wagon-card-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2px;
  }
  .wagon-title-area{
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .drag-handle{
    color: var(--muted);
    font-size: 14px;
    cursor: grab;
  }
  .wagon-title-area h3{ font-size: 13px; color: var(--amber); }
  .wagon-controls{
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wagon-top{ display:flex; gap:12px; align-items:flex-start; }

  .ext-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .ext-slot{
    display:flex; flex-direction:column; gap:4px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .ext-slot:hover{ border-color: var(--amber); background: #273442; }
  .ext-slot .slot-preview{ width:100%; height: 50px; pointer-events: none; }
  .ext-name{
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Output section */
  .output-scroll{
    width: 100%;
    overflow-x: auto;
    padding: 14px 0;
  }
  .output-row{
    display:flex;
    flex-direction: row-reverse;
    align-items: center;
    gap: 0;
    width: max-content;
    margin: 0 auto;
    padding: 0 24px;
  }
  .output-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 10px 10px;
    position: relative;
    flex-shrink: 0;
  }
  .output-engine{ width: 132px; text-align:center; }
  .output-wagon{ width: 230px; }
  .output-card .slot-preview{ margin: 0 auto; pointer-events: none; }
  .output-engine .slot-preview{ width: 104px; height: 104px; }
  .output-wagon .slot-preview{ width: 90px; height: 90px; margin-bottom: 8px; }
  .output-card .card-label{
    text-align:center; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; margin-top: 6px;
  }
  .coupler{
    width: 16px; height: 4px; align-self: center;
    background: var(--amber-dim);
    flex-shrink: 0;
  }
  .output-ext-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }
  .output-ext-slot{
    width:100%; height: 42px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .output-ext-slot img{ max-width:100%; max-height:100%; object-fit:contain; }
  .empty-state{
    color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center;
  }

  .output-toolbar{
    display:flex; gap:8px; margin: 0 0 4px;
    flex-wrap: wrap; align-items:center; justify-content:flex-end;
  }
  .output-toolbar button{ font-size: 12.5px; }

  /* Icon Picker Modal */
  .modal-overlay{
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(10, 14, 18, 0.8);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.open{ display: flex; }
  .modal-content{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    width: 480px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 16px;
  }
  .modal-header h3{ color: var(--amber); font-size: 16px; }
  .modal-close{
    background:none; border:none; color: var(--muted); font-size: 18px; cursor:pointer; padding:2px 6px;
  }
  .modal-close:hover{ color: var(--text); }
  .picker-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 12px;
  }
  .picker-item{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .picker-item:hover{
    border-color: var(--amber);
    transform: translateY(-2px);
  }
  .picker-item.active{
    border-color: var(--amber);
    background: rgba(255, 182, 39, 0.1);
  }
  .picker-item .picker-preview{
    width: 54px; height: 54px;
    display:flex; align-items:center; justify-content:center;
  }
  .picker-item img{ max-width:100%; max-height:100%; object-fit:contain; }
  .picker-item .picker-label{
    font-size: 11.5px; text-align: center; color: var(--text); word-break: break-word;
  }

  footer{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 30px; }
  footer .track{ margin: 20px 0 14px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>UNRAILED 2 — WAGON SETUP BUILDER</h1>
  </header>

  <div class="track"></div>

  <details class="panel" id="libraryPanel" style="display: none;">
    <summary>Image Library</summary>

    <div class="lib-toolbar">
      <button class="primary" onclick="exportLibrary()">⭳ Save library</button>
      <button onclick="document.getElementById('importLibraryFile').click()">⭱ Load library</button>
      <input type="file" id="importLibraryFile" accept="application/json" style="display:none" onchange="importLibrary(this.files[0])">
    </div>

    <div class="lib-grid">
      <div class="lib-col">
        <h3>Engine</h3>
        <div id="libEngine"></div>
        <button class="add-btn" onclick="addLibRow('engine')">+ Add engine image</button>
      </div>
      <div class="lib-col">
        <h3>Wagons</h3>
        <div id="libWagon"></div>
        <button class="add-btn" onclick="addLibRow('wagon')">+ Add wagon image</button>
      </div>
      <div class="lib-col">
        <h3>Extensions</h3>
        <div id="libExt"></div>
        <button class="add-btn" onclick="addLibRow('ext')">+ Add extension image</button>
      </div>
    </div>
  </details>

  <section id="builderSection">
    <div class="lib-toolbar">
      <button class="primary" onclick="exportSetup()">⭳ Save setup</button>
      <button onclick="document.getElementById('importSetupFile').click()">⭱ Load setup</button>
      <button onclick="exportShareCode()">📋 Export code</button>
      <button onclick="importShareCode()">📥 Import code</button>
      <button class="danger-btn" onclick="clearSetup()">🗑 Clear setup</button>
      <input type="file" id="importSetupFile" accept="application/json" style="display:none" onchange="importSetup(this.files[0])">
    </div>

    <div class="engine-row">
      <div class="engine-card" id="engineCard">
        <div class="slot-preview clickable" id="enginePreview" title="Click to choose Engine" onclick="openPicker('engine')"></div>
        <div class="engine-meta" style="flex:1">
          <div class="meta-field">
            <label class="meta-label">Engine Type</label>
            <button class="select-btn" id="engineTypeBtn" onclick="openPicker('engine')">— select —</button>
          </div>
          <div class="meta-field" style="margin-top: 10px;">
            <label class="meta-label">Level</label>
            <input type="number" class="level-input" id="engineLevelInput" min="1" step="1" value="1" title="Level">
          </div>
        </div>
        <div class="card-badge" id="engineBadge">Lv 1</div>
      </div>
    </div>

    <div class="builder-toolbar">
      <button class="primary" onclick="addWagon()">+ Add wagon</button>
      <span class="count" id="wagonCount">0 wagons</span>
    </div>

    <div class="wagons-scroll">
      <div class="wagons-row" id="wagonsRow"></div>
    </div>
  </section>

  <div class="track"></div>

  <section id="outputSection">
    <div class="output-toolbar">
      <button class="primary" onclick="downloadOutputPng(event)">⭳ Download PNG</button>
    </div>
    <div class="output-scroll">
      <div class="output-row" id="outputRow"></div>
    </div>
  </section>

  <footer>
    <div class="track"></div>
  </footer>

</div>

<div class="modal-overlay" id="pickerModal" onclick="closePickerOnOverlay(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="pickerTitle">Select Item</h3>
      <button class="modal-close" onclick="closePicker()">✕</button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// Define the URL to your setups database file
const GITHUB_SETUPS_URL = 'setups.json';
// ---------- Model ----------
const STORAGE_KEY = 'unrailed2_wagon_builder_state_v3';
let uid = 1;
const nextId = () => String(uid++);

let library = {
  engine: [ { id: nextId(), type: 'Standard', path: 'images/engine_standard.png' } ],
  wagon:  [ { id: nextId(), type: 'Basic', path: 'images/wagon_basic.png' } ],
  ext:    [ { id: nextId(), type: 'Storage Ext.', path: 'images/ext_storage.png' } ],
};

let engineChoice = { id: library.engine[0].id, level: 1 };
let wagons = [];

const EXT_SLOTS = 12;
let currentPickerTarget = null;
let draggedWagonIndex = null;

// ---------- Persistence ----------
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ uid, library, engineChoice, wagons }));
  }catch(e){ /* ignore */ }
}

function loadPersisted(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || !data.library) return false;
    uid = data.uid || uid;
    library = data.library;
    engineChoice = data.engineChoice || engineChoice;
    wagons = data.wagons || [];
    return true;
  }catch(e){ return false; }
}

function clearSetup(){
  if(confirm("Are you sure you want to clear the current wagon setup?")){
    engineChoice = { id: library.engine[0] ? library.engine[0].id : '', level: 1 };
    wagons = [];
    persist();
    renderEngine();
    renderWagons();
  }
}

function downloadJson(filename, data){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportLibrary(){ downloadJson('unrailed2-image-library.json', { uid, library }); }

function importLibrary(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data || !data.library) throw new Error('bad file');
      uid = Math.max(uid, data.uid || 0);
      library = data.library;
      persist();
      renderLibrary();
    }catch(err){ alert('Could not read library file.'); }
  };
  reader.readAsText(file);
}

function exportSetup(){
  const userSetupName = prompt('Enter a name for this setup:', 'my-wagon-setup');
  if (userSetupName === null) return;

  const sanitizedName = userSetupName.trim().replace(/[^a-z0-9_\-]/gi, '_') || 'unrailed2-wagon-setup';
  downloadJson(`${sanitizedName}.json`, { engineChoice, wagons });
}

function importSetup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data || !('wagons' in data)) throw new Error('bad file');
      engineChoice = data.engineChoice || { id:'', level:1 };
      wagons = data.wagons || [];
      persist();
      renderEngine();
      renderWagons();
    }catch(err){ alert('Could not read setup file.'); }
  };
  reader.readAsText(file);
}

// ---------- Share Code Export & Import ----------
// ---------- 8-Character Share Code Export & Import (Vercel API) ----------
function generate8Charcode() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let code = '';
  for (let i = 0; i < 8; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

// Export function: sends code + payload to /api/save-setup
async function exportShareCode() {
  const code = generate8Charcode();
  const buildPayload = {
    engineChoice,
    wagons
  };

  try {
    const res = await fetch('/api/save-setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, payload: buildPayload })
    });

    const result = await res.json();

    if (!res.ok) {
      throw new Error(result.error || 'Failed to save setup');
    }

    // Copy the code to clipboard automatically
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(code);
    }

    alert(`Setup automatically saved!\n\nYour 8-character share code is: ${code}\nIt can take multiple minutes for the code to become accessible.\n(Copied to clipboard)`);

  } catch (err) {
    console.error(err);
    alert(`Could not automatically save setup: ${err.message}`);
  }
}

// Import function: fetches setups.json directly
async function importShareCode() {
  let code = prompt("Enter your 8-character setup code (e.g. X7K9P2M4):");
  if (!code || !code.trim()) return;

  code = code.trim().toUpperCase();

  if (!/^[A-Z0-9]{8}$/.test(code)) {
    alert("Invalid code format! Code must be exactly 8 capital letters and numbers.");
    return;
  }

  try {
    const response = await fetch(`${GITHUB_SETUPS_URL}?t=${Date.now()}`);
    
    if (!response.ok) {
      throw new Error(`Server returned status ${response.status} (${response.statusText})`);
    }

    const database = await response.json();
    const data = database[code];

    if (!data) {
      alert(`Code "${code}" was not found, if it was created recently it can take a few minutes to become accessible.`);
      return;
    }

    engineChoice = data.engineChoice || { id: '', level: 1 };
    wagons = data.wagons || [];

    persist();
    renderEngine();
    renderWagons();
    alert(`Setup "${code}" loaded successfully!`);
  } catch (err) {
    console.error("Import Error Details:", err);
    alert(`Failed to load setup code:\n${err.message}`);
  }
}

// ---------- Auto-load Library File ----------
async function autoLoadLibrary(){
  try{
    const res = await fetch('unrailed2-image-library.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return;
    const data = await res.json();
    if(data && data.library){
      uid = Math.max(uid, data.uid || 0);
      library = data.library;
      persist();
    }
  }catch(e){ /* ignore if not present */ }
}

// ---------- Helpers ----------
function findById(type, id){ return library[type].find(item => item.id === id); }
function itemLabel(item){ return item.type; }

function buildPreview(container, type, id){
  container.innerHTML = '';
  const item = id ? findById(type, id) : null;
  if(!item || !item.path){
    container.classList.add('placeholder');
    container.textContent = item ? '(no path)' : '—';
    return;
  }
  container.classList.remove('placeholder');
  const img = document.createElement('img');
  img.src = item.path;
  img.alt = itemLabel(item);
  img.addEventListener('error', () => {
    container.classList.add('placeholder');
    container.textContent = itemLabel(item) + ' (missing)';
    img.remove();
  });
  container.appendChild(img);
}

// ---------- Library rendering ----------
function renderLibrary(){
  renderLibCol('engine', document.getElementById('libEngine'));
  renderLibCol('wagon', document.getElementById('libWagon'));
  renderLibCol('ext', document.getElementById('libExt'));
  renderEngine();
  renderWagons();
  persist();
}

function renderLibCol(libType, container){
  container.innerHTML = '';
  library[libType].forEach(item => {
    const row = document.createElement('div');
    row.className = 'lib-row';

    const typeInput = document.createElement('input');
    typeInput.value = item.type;
    typeInput.placeholder = 'Type';
    typeInput.addEventListener('input', (e) => {
      item.type = e.target.value;
      renderEngine();
      renderWagons();
      persist();
    });

    const pathInput = document.createElement('input');
    pathInput.className = 'path';
    pathInput.value = item.path;
    pathInput.placeholder = 'images/example.png';
    pathInput.addEventListener('input', (e) => {
      item.path = e.target.value;
      renderEngine();
      renderWagons();
      persist();
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.textContent = '✕';
    delBtn.title = 'Remove row';
    delBtn.addEventListener('click', () => {
      library[libType] = library[libType].filter(i => i.id !== item.id);
      renderLibrary();
    });

    row.appendChild(typeInput);
    row.appendChild(pathInput);
    row.appendChild(delBtn);
    container.appendChild(row);
  });
}

function addLibRow(libType){
  library[libType].push({ id: nextId(), type: '', path: '' });
  renderLibrary();
}

// ---------- Visual Icon Picker ----------
function openPicker(category, wagonId = null, extIndex = null){
  currentPickerTarget = { category, wagonId, extIndex };
  const modal = document.getElementById('pickerModal');
  const title = document.getElementById('pickerTitle');
  const grid = document.getElementById('pickerGrid');

  const catNames = { engine: 'Engine', wagon: 'Wagon', ext: 'Extension' };
  title.textContent = `Select ${catNames[category] || 'Item'}`;
  grid.innerHTML = '';

  const activeId = getSelectedId();

  if(category === 'ext'){
    const noneItem = document.createElement('div');
    noneItem.className = 'picker-item' + (!activeId ? ' active' : '');
    noneItem.innerHTML = `
      <div class="picker-preview slot-preview placeholder">Empty</div>
      <div class="picker-label">None</div>
    `;
    noneItem.onclick = () => selectPickerItem('');
    grid.appendChild(noneItem);
  }

  const items = library[category] || [];
  items.forEach(item => {
    const itemEl = document.createElement('div');
    itemEl.className = 'picker-item' + (item.id === activeId ? ' active' : '');

    const prevDiv = document.createElement('div');
    prevDiv.className = 'picker-preview';
    buildPreview(prevDiv, category, item.id);

    const labelDiv = document.createElement('div');
    labelDiv.className = 'picker-label';
    labelDiv.textContent = item.type || 'Unnamed';

    itemEl.appendChild(prevDiv);
    itemEl.appendChild(labelDiv);
    itemEl.onclick = () => selectPickerItem(item.id);
    grid.appendChild(itemEl);
  });

  if(items.length === 0 && category !== 'ext'){
    grid.innerHTML = `<div style="color:var(--muted); font-size:13px; grid-column:1/-1; text-align:center; padding: 20px 0;">No items found in library. Add them above!</div>`;
  }

  modal.classList.add('open');
}

function getSelectedId(){
  if(!currentPickerTarget) return null;
  const { category, wagonId, extIndex } = currentPickerTarget;
  if(category === 'engine') return engineChoice.id;
  if(category === 'wagon'){
    const w = wagons.find(w => w.id === wagonId);
    return w ? w.wagonId : null;
  }
  if(category === 'ext'){
    const w = wagons.find(w => w.id === wagonId);
    return (w && extIndex !== null) ? w.exts[extIndex] : null;
  }
  return null;
}

function selectPickerItem(id){
  if(!currentPickerTarget) return;
  const { category, wagonId, extIndex } = currentPickerTarget;
  if(category === 'engine'){
    engineChoice.id = id;
    renderEngine();
  } else if(category === 'wagon'){
    const w = wagons.find(w => w.id === wagonId);
    if(w) w.wagonId = id;
    renderWagons();
  } else if(category === 'ext'){
    const w = wagons.find(w => w.id === wagonId);
    if(w && extIndex !== null) w.exts[extIndex] = id;
    renderWagons();
  }
  persist();
  closePicker();
}

function closePicker(){
  document.getElementById('pickerModal').classList.remove('open');
  currentPickerTarget = null;
}

function closePickerOnOverlay(e){
  if(e.target.id === 'pickerModal') closePicker();
}

// ---------- Engine ----------
function renderEngine(){
  const currentItem = findById('engine', engineChoice.id);
  const typeBtn = document.getElementById('engineTypeBtn');
  if(typeBtn){
    typeBtn.textContent = currentItem ? currentItem.type : '— select engine —';
  }

  const levelInput = document.getElementById('engineLevelInput');
  levelInput.value = engineChoice.level || 1;
  levelInput.oninput = (e) => {
    engineChoice.level = e.target.value;
    document.getElementById('engineBadge').textContent = 'Lv ' + (engineChoice.level || '—');
    persist();
    renderOutput();
  };

  buildPreview(document.getElementById('enginePreview'), 'engine', engineChoice.id);
  document.getElementById('engineBadge').textContent = 'Lv ' + (engineChoice.level || '—');
  renderOutput();
}

// ---------- Wagons & Drag-and-Drop ----------
function addWagon(){
  wagons.push({ id: nextId(), wagonId: '', level: 1, exts: new Array(EXT_SLOTS).fill('') });
  renderWagons();
  persist();
}

function removeWagon(id){
  wagons = wagons.filter(w => w.id !== id);
  renderWagons();
  persist();
}

function renderWagons(){
  const row = document.getElementById('wagonsRow');
  row.innerHTML = '';
  document.getElementById('wagonCount').textContent =
    wagons.length + (wagons.length === 1 ? ' wagon' : ' wagons');

  wagons.forEach((w, idx) => {
    const card = document.createElement('div');
    card.className = 'wagon-card';
    card.setAttribute('draggable', 'true');

    card.addEventListener('dragstart', (e) => {
      draggedWagonIndex = idx;
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });

    card.addEventListener('dragend', () => {
      draggedWagonIndex = null;
      card.classList.remove('dragging');
      document.querySelectorAll('.wagon-card').forEach(c => c.classList.remove('drag-over'));
    });

    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });

    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over');
    });

    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (draggedWagonIndex !== null && draggedWagonIndex !== idx) {
        const [dragged] = wagons.splice(draggedWagonIndex, 1);
        wagons.splice(idx, 0, dragged);
        renderWagons();
        persist();
      }
    });

    const header = document.createElement('div');
    header.className = 'wagon-card-header';

    const titleArea = document.createElement('div');
    titleArea.className = 'wagon-title-area';
    titleArea.title = 'Click & drag to reorder wagon';
    titleArea.innerHTML = `<span class="drag-handle">⠿</span><h3>Wagon ${idx + 1}</h3>`;

    const controls = document.createElement('div');
    controls.className = 'wagon-controls';

    const badge = document.createElement('div');
    badge.className = 'card-badge-inline';
    badge.textContent = 'Lv ' + (w.level || '—');

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn wagon-del';
    delBtn.textContent = '✕';
    delBtn.title = 'Remove wagon';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      removeWagon(w.id);
    });

    controls.appendChild(badge);
    controls.appendChild(delBtn);
    header.appendChild(titleArea);
    header.appendChild(controls);
    card.appendChild(header);

    const top = document.createElement('div');
    top.className = 'wagon-top';

    const preview = document.createElement('div');
    preview.className = 'slot-preview clickable';
    preview.title = 'Click to choose wagon type';
    preview.onclick = () => openPicker('wagon', w.id);
    buildPreview(preview, 'wagon', w.wagonId);

    const metaWrap = document.createElement('div');
    metaWrap.style.flex = '1';
    metaWrap.style.minWidth = '0';

    const currentWagon = findById('wagon', w.wagonId);
    
    const typeLabel = document.createElement('label');
    typeLabel.className = 'meta-label';
    typeLabel.textContent = 'Wagon Type';

    const typeBtn = document.createElement('button');
    typeBtn.type = 'button';
    typeBtn.className = 'select-btn';
    typeBtn.textContent = currentWagon ? currentWagon.type : '— select wagon —';
    typeBtn.onclick = () => openPicker('wagon', w.id);

    const levelLabel = document.createElement('label');
    levelLabel.className = 'meta-label';
    levelLabel.style.marginTop = '8px';
    levelLabel.textContent = 'Level';

    const levelInput = document.createElement('input');
    levelInput.type = 'number';
    levelInput.min = '1';
    levelInput.step = '1';
    levelInput.className = 'level-input';
    levelInput.value = w.level || 1;
    levelInput.title = 'Level';
    levelInput.addEventListener('input', (e) => {
      w.level = e.target.value;
      badge.textContent = 'Lv ' + (w.level || '—');
      persist();
      renderOutput();
    });

    metaWrap.appendChild(typeLabel);
    metaWrap.appendChild(typeBtn);
    metaWrap.appendChild(levelLabel);
    metaWrap.appendChild(levelInput);

    top.appendChild(preview);
    top.appendChild(metaWrap);
    card.appendChild(top);

    const grid = document.createElement('div');
    grid.className = 'ext-grid';
    for(let i = 0; i < EXT_SLOTS; i++){
      const slot = document.createElement('div');
      slot.className = 'ext-slot';
      slot.title = `Click to change slot ${i+1}`;
      slot.onclick = () => openPicker('ext', w.id, i);

      const sPreview = document.createElement('div');
      sPreview.className = 'slot-preview';
      buildPreview(sPreview, 'ext', w.exts[i]);

      const extItem = findById('ext', w.exts[i]);
      const extName = document.createElement('div');
      extName.className = 'ext-name';
      extName.textContent = extItem ? extItem.type : 'Empty';

      slot.appendChild(sPreview);
      slot.appendChild(extName);
      grid.appendChild(slot);
    }
    card.appendChild(grid);

    row.appendChild(card);
  });

  renderOutput();
}

// ---------- Output Preview ----------
function renderOutput(){
  const out = document.getElementById('outputRow');
  if(!out) return;
  out.innerHTML = '';

  if(wagons.length === 0 && !engineChoice.id){
    out.innerHTML = '<div class="empty-state">Nothing to show yet — pick an engine and add a wagon above.</div>';
    return;
  }

  const engineCard = document.createElement('div');
  engineCard.className = 'output-card output-engine';
  const engineBadge = document.createElement('div');
  engineBadge.className = 'card-badge';
  engineBadge.textContent = 'Lv ' + (engineChoice.level || '—');
  const enginePrev = document.createElement('div');
  enginePrev.className = 'slot-preview';
  buildPreview(enginePrev, 'engine', engineChoice.id);
  const engineLbl = document.createElement('div');
  engineLbl.className = 'card-label';
  engineLbl.textContent = 'Engine';
  engineCard.appendChild(engineBadge);
  engineCard.appendChild(enginePrev);
  engineCard.appendChild(engineLbl);
  out.appendChild(engineCard);

  wagons.forEach((w, idx) => {
    const coupler = document.createElement('div');
    coupler.className = 'coupler';
    out.appendChild(coupler);

    const wCard = document.createElement('div');
    wCard.className = 'output-card output-wagon';

    const wBadge = document.createElement('div');
    wBadge.className = 'card-badge';
    wBadge.textContent = 'Lv ' + (w.level || '—');
    wCard.appendChild(wBadge);

    const wPrev = document.createElement('div');
    wPrev.className = 'slot-preview';
    buildPreview(wPrev, 'wagon', w.wagonId);
    wCard.appendChild(wPrev);

    const wLbl = document.createElement('div');
    wLbl.className = 'card-label';
    wLbl.textContent = 'Wagon ' + (idx + 1);
    wCard.appendChild(wLbl);

    const extGrid = document.createElement('div');
    extGrid.className = 'output-ext-grid';
    extGrid.style.marginTop = '8px';
    for(let i = 0; i < EXT_SLOTS; i++){
      const item = w.exts[i] ? findById('ext', w.exts[i]) : null;
      if(!item) continue;

      const slot = document.createElement('div');
      slot.className = 'output-ext-slot';
      const img = document.createElement('img');
      img.src = item.path;
      img.alt = item.type;
      img.addEventListener('error', () => { slot.remove(); });
      slot.appendChild(img);
      extGrid.appendChild(slot);
    }
    if(extGrid.children.length) wCard.appendChild(extGrid);

    out.appendChild(wCard);
  });
}

// ---------- Export: download output as PNG ----------
async function downloadOutputPng(evt){
  const target = document.getElementById('outputRow');
  if(!target) return;

  const userBuildName = prompt('Enter a name for this build:', 'my-train-build');
  if (userBuildName === null) return;

  const sanitizedName = userBuildName.trim().replace(/[^a-z0-9_\-]/gi, '_') || 'unrailed2-train-setup';

  const btn = evt && evt.target;
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.textContent = 'Rendering…'; btn.disabled = true; }
  try{
    const canvas = await html2canvas(target, {
      backgroundColor: null,
      scale: 2,
      useCORS: true
    });
    const link = document.createElement('a');
    link.download = `${sanitizedName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    console.error('PNG export failed:', err);
    alert('Could not export PNG. See console for details.');
  }finally{
    if(btn){ btn.textContent = originalLabel; btn.disabled = false; }
  }
}

// ---------- Init ----------
async function init(){
  const restored = loadPersisted();
  if(!restored && wagons.length === 0){
    addWagon();
  }
  await autoLoadLibrary();
  renderLibrary();
}

init();
</script>
